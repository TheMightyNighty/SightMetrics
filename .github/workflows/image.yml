name: Container-Image

# Baut und veröffentlicht das Ingestion-Image nach GHCR.
# Trigger: Versions-Tags (v1.2.3) + manuell (workflow_dispatch).
# Betreiber pinnen das Image per Digest (siehe Job-Ausgabe und
# ingestion/scheduling/k8s/cronjob.yaml).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: "Ingestion-Image -> GHCR"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: GHCR-Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten (Tags/Labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sightmetrics-ingestion
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          # GitHub erkennt nur "GPL-2.0"; die Lizenz ist GPL-2.0-or-later.
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later

      - name: Build & Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ingestion
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Digest fuer Pinning ausgeben
        run: |
          echo "Image-Digest (fuer cronjob.yaml):"
          echo "ghcr.io/${{ github.repository_owner }}/sightmetrics-ingestion@${{ steps.push.outputs.digest }}"
