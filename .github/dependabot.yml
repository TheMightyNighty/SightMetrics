version: 2

# Ergänzt die (bereits aktiven) Security-Alerts um regelmäßige Update-PRs.
# Wöchentlich, klein gehalten: Security-Updates laufen unabhängig davon sofort.
#
# /demo/app fehlt bewusst: Das path-Repository "/packages/*" existiert nur im
# Demo-Container, Dependabot kann die Abhängigkeiten dort nicht auflösen.
updates:
  - package-ecosystem: composer
    directory: /extension/sight_metrics
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories:
      - /extension/sight_metrics
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (nativer Compiler) bricht die JSDoc-Typprüfung
      # (export.js/createI18n); Umstieg separat angehen.
      - dependency-name: typescript
        versions: [">= 7"]

  - package-ecosystem: docker
    directories:
      - /ingestion
      - /demo
    schedule:
      interval: weekly

  # Images in den Compose-Dateien. ingestion/tests/matomo fehlt bewusst: Die
  # Matomo-Version ist an die Fixtures in ingestion/tests/matomo_fixture gebunden.
  - package-ecosystem: docker-compose
    directory: /demo
    schedule:
      interval: weekly
    ignore:
      # MariaDB bleibt auf der LTS-Linie; Major-Wechsel bewusst von Hand.
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
